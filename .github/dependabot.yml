# Dependabot — keeps this repo's GitHub Actions and Go modules current.
#
# WHY THIS FILE EXISTS
# --------------------
# This repo had no dependabot.yml at all. The result, measured 2026-09-23: the
# only workflow here (.github/workflows/ghcr-publish.yml) still pinned
# actions/checkout@v4 and the v3/v5-era docker actions, all of which declare
# `using: node20` in their action.yml. GitHub now force-runs those on Node 24
# and prints, on every run:
#
#   Node.js 20 is deprecated. The following actions target Node.js 20 but are
#   being forced to run on Node.js 24: actions/checkout@v4, ...
#
# Nothing was blocking the bump — nothing was asking for it. This file is the
# thing that asks.
#
# THE gomod ENTRY IS NOT REDUNDANT
# --------------------------------
# PR #1 ("Bump the go_modules group across 1 directory with 2 updates") was a
# Dependabot SECURITY update. Those run from the repo's Dependabot alerts and
# need no config file, so they ran here with none. Version updates — the
# routine "a new release exists" bumps — do NOT. Without the entry below, this
# repo only ever hears about a Go dependency once it has a published
# vulnerability. The entry makes the routine updates explicit as well.
#
# THIS FILE DOES NOTHING UNTIL IT REACHES THE DEFAULT BRANCH.
# ----------------------------------------------------------
# Dependabot reads .github/dependabot.yml from the DEFAULT branch only (`main`
# here). A copy on a feature branch configures nothing. Expected, not a defect.
#
# GROUPED ON PURPOSE
# ------------------
# One grouped PR a week per ecosystem is reviewable. Ungrouped, five actions
# plus a Go module graph is a PR flood that gets muted, and a muted bot is
# worse than no bot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod-all:
        patterns: ["*"]
